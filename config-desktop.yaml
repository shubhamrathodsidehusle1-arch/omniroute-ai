litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  num_retries: 2
  fallbacks:
    - claude-sonnet-4-6: ["deepseek-r1", "claude-haiku-4-5-20251001"]
    - claude-opus-4-9-20260710:
      - claude-sonnet-4-6
      - deepseek-v4-pro
      - deepseek-v4-flash
    - deepseek-v4-pro: ["deepseek-v4-flash"]

router_settings:
  cooldown_time: 30
  allowed_fails: 3
  routing_strategy: usage-based-routing
