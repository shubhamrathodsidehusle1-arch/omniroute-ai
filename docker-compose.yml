networks:
  claws-network:
    driver: bridge

services:
  permissions-init:
    image: alpine:latest
    container_name: permissions-init
    command:
      - sh
      - -c
      - |
        mkdir -p /workspace/docker-data/omniroute-data \
          /workspace/docker-data/openclaw_data \
          /workspace/docker-data/cc-data \
          /workspace/docker-data/hermes_data \
          /workspace/docker-data/n8n-data \
          /workspace/docker-data/paperclip-data \
          /workspace/docker-data/openalice-data \
          /workspace/docker-data/automaton-data
        chmod -R 777 /workspace/docker-data
        echo "Created docker-data directories and applied permissions"
    volumes:
      - ./docker-data:/workspace/docker-data
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - claws-network

  omniroute-redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - claws-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: diegosouzapw/omniroute@sha256:badb560971fdc23c2fb84b3e8695116239ff215b4cca4b07076201a8efae7f0d
    container_name: omniroute
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "20128:20128"
    volumes:
      - ./docker-data/omniroute-data:/app/data
    environment:
      - PORT=20128
      - REDIS_URL=redis://omniroute-redis:6379
      - OMNIROUTE_BASE_PATH=/omniroute
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:20128/v1/models',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - claws-network
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      omniroute-redis:
        condition: service_healthy

  omniroute-init:
    image: alpine:latest
    container_name: omniroute-init
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      sh -c "
      apk add --no-cache bash sqlite nodejs 2>/dev/null &&
      bash /scripts/omniroute-seed.sh
      "
    restart: "on-failure:5"
    volumes:
      - ./docker-data/omniroute-data:/app/data
      - ./scripts/omniroute-seed.sh:/scripts/omniroute-seed.sh:ro
    environment:
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_WORKER_AI_API_KEY}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_WORKER_AI_ACCOUNT_ID}
      - NVIDIA_API_KEY=${NVIDIA_NIM_API_KEY}
      - OPENROUTER_API_KEY_0=${OPENROUTER_API_KEY_0}
      - OPENROUTER_API_KEY_1=${OPENROUTER_API_KEY_1}
      - OPENROUTER_API_KEY_2=${OPENROUTER_API_KEY_2}
      - OPENROUTER_API_KEY_3=${OPENROUTER_API_KEY_3}
      - OPENROUTER_API_KEY_4=${OPENROUTER_API_KEY_4}
      - OPENROUTER_API_KEY_5=${OPENROUTER_API_KEY_5}
      - OPENROUTER_API_KEY_6=${OPENROUTER_API_KEY_6}
      - OPENROUTER_API_KEY_7=${OPENROUTER_API_KEY_7}
      - OPENROUTER_API_KEY_8=${OPENROUTER_API_KEY_8}
      - OPENROUTER_API_KEY_9=${OPENROUTER_API_KEY_9}
      - KILO_API_KEY_1=${KILO_API_KEY_1}
      - KILO_API_KEY_2=${KILO_API_KEY_2}
      - KILO_API_KEY_3=${KILO_API_KEY_3}
    networks:
      - claws-network
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      omniroute:
        condition: service_healthy

  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    container_name: openclaw
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    ports:
      - "18789:18789"
      - "3333:3333"
    volumes:
      - ./env.json:/app/env.json
      - ./mcp.json:/app/mcp.json:ro
      - ./configs/openclaw.json:/configs/openclaw.json:ro
      - ./docker-data/openclaw_data:/root/.openclaw
      - ./docker-data/cc-data:/data
    environment:
      - OMNIROUTE_URL=http://omniroute:20128
      - OMNI_ROUTE_API_KEY=${OMNI_ROUTE_API_KEY}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    command: sh /entrypoint-openclaw.sh
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    networks:
      - claws-network

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    container_name: hermes-agent
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -u admin:$$HERMES_ADMIN_PASSWORD http://localhost:9119/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    ports:
      - "9119:9119"
    volumes:
      - ./docker-data/hermes_data:/root/.hermes
      - ./mcp.json:/root/.hermes/mcp.json:ro
      - ./env.json:/app/env.json
    environment:
      - OMNIROUTE_URL=http://omniroute:20128
      - OMNI_ROUTE_API_KEY=${OMNI_ROUTE_API_KEY}
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY}
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    networks:
      - claws-network

  paperclip:
    build:
      context: .
      dockerfile: Dockerfile.paperclip
    container_name: paperclip
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "3100:3100"
    volumes:
      - ./docker-data/paperclip-data:/paperclip
      - ./docker-data/hermes_data:/root/.hermes
    environment:
      - HOST=0.0.0.0
      - PORT=3100
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_INSTANCE_ID=default
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private
      - PAPERCLIP_MIGRATION_PROMPT=never
      - PAPERCLIP_MIGRATION_AUTO_APPLY=true
      - PAPERCLIP_AGENT_JWT_SECRET=${PAPERCLIP_AGENT_JWT_SECRET}
      - PAPERCLIP_PUBLIC_URL=http://localhost:3100
      - OMNIROUTE_URL=http://omniroute:20128
      - OMNI_ROUTE_API_KEY=${OMNI_ROUTE_API_KEY}
      - ANTHROPIC_BASE_URL=http://omniroute:20128
      - ANTHROPIC_API_KEY=${OMNI_ROUTE_API_KEY}
      - OPENAI_BASE_URL=http://omniroute:20128/v1
      - OPENAI_API_KEY=${OMNI_ROUTE_API_KEY}
      - HERMES_URL=http://hermes-agent:9119
    command: |
      sh -c "
        mkdir -p /paperclip/instances/default/db && chmod 0700 /paperclip/instances/default/db &&
        ln -sf /app/server/src/built-ins /app/server/dist/built-ins &&
        node --import /app/server/node_modules/tsx/dist/loader.mjs /app/server/dist/index.js
      "
    networks:
      - claws-network
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      hermes:
        condition: service_started

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL}/n8n/
      - OMNIROUTE_URL=http://omniroute:20128
      - HERMES_URL=http://hermes-agent:9119
      - PAPERCLIP_URL=http://paperclip:3100
    volumes:
      - ./docker-data/n8n-data:/home/node/.n8n
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    networks:
      - claws-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  openalice:
    build:
      context: .
      dockerfile: Dockerfile.openalice
    container_name: openalice
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    stdin_open: true
    tty: true
    ports:
      - "47331:47331"
    volumes:
      - ./docker-data/openalice-data:/data
    environment:
      - OMNIROUTE_URL=http://omniroute:20128
      - ANTHROPIC_BASE_URL=http://omniroute:20128
      - ANTHROPIC_API_KEY=${OMNI_ROUTE_API_KEY}
      - OPENAI_BASE_URL=http://omniroute:20128/v1
      - OPENAI_API_KEY=${OMNI_ROUTE_API_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      omniroute:
        condition: service_started
    networks:
      - claws-network

  automaton:
    build:
      context: .
      dockerfile: Dockerfile.automaton
    container_name: automaton
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - ./docker-data/automaton-data:/data
    environment:
      - OMNIROUTE_URL=http://omniroute:20128
      - OMNI_ROUTE_API_KEY=${OMNI_ROUTE_API_KEY}
      - AUTOMATON_NAME=${AUTOMATON_NAME:-omniroute-automaton}
      - AUTOMATON_BUDGET_USD=${AUTOMATON_BUDGET_USD:-20}
      - AUTOMATON_RESET_THRESHOLD_USD=${AUTOMATON_RESET_THRESHOLD_USD:-2}
      - AUTOMATON_FUND_CHECK_INTERVAL=${AUTOMATON_FUND_CHECK_INTERVAL:-120}
      - AUTOMATON_INFERENCE_MODEL=${AUTOMATON_INFERENCE_MODEL:-auto/best-free}
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      omniroute:
        condition: service_started
    networks:
      - claws-network

  service-updater:
    build:
      context: .
      dockerfile: Dockerfile.service-updater
    container_name: service-updater
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - UPDATER_INTERVAL=${UPDATER_INTERVAL:-3600}
      - COMPOSE_PROJECT_NAME=omniroute-ai
      - COMPOSE_FILE=/root/omniroute-ai/docker-compose.yml
      - COMPOSE_PROJECT_DIR=/root/omniroute-ai
      - UPDATER_EXCLUDE=${UPDATER_EXCLUDE:-omniroute,omniroute-redis,hermes}
    volumes:
      - ./:/root/omniroute-ai
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    networks:
      - claws-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f service_updater.py || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  service-controller:
    build:
      context: .
      dockerfile: Dockerfile.service-controller
    container_name: service-controller
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - COMPOSE_PROJECT_NAME=omniroute-ai
      - COMPOSE_FILE=/root/omniroute-ai/docker-compose.yml
      - COMPOSE_PROJECT_DIR=/root/omniroute-ai
    volumes:
      - ./:/root/omniroute-ai:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    networks:
      - claws-network

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=20
      - AUTOHEAL_START_PERIOD=180
      - AUTOHEAL_DOCKER_SOCKET=/var/run/docker.sock
      - CURL_TIMEOUT=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - claws-network
