# Ngrok domain — proxies /omniroute to OmniRoute
server {
    listen 80;
    server_name *.ngrok-free.dev;

    location / {
        return 301 /omniroute/dashboard;
    }

    location = /dashboards {
        return 301 /dashboards/;
    }

    location /dashboards/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location = /omniroute {
        return 301 /omniroute/;
    }

    location /omniroute/ {
        proxy_pass http://omniroute:20128/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /omniroute;
        proxy_redirect / /omniroute/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # OmniRoute Next.js static assets (served at root but needed for the SPA)
    location ~ ^/(_next/static|favicon\.ico|favicon\.svg|icon-\d+\.png|apple-touch-icon\.png|manifest\.webmanifest) {
        proxy_pass http://omniroute:20128;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OmniRoute SPA root-level routes + API (client-side redirects bypass /omniroute/ prefix)
    location ~ ^/(api|home|login|landing|status|privacy|terms|forgot-password|callback|forbidden|offline|maintenance|docs|dashboard|connect|400|401|403|408|429|500|502|503)(/|$) {
        proxy_pass http://omniroute:20128;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Default (localhost/direct IP) — dashboard only
server {
    listen 80 default_server;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
}
