# Ngrok/custom domain — serve dashboard at /mydata
server {
    listen 80;
    server_name *.ngrok-free.dev *.ngrok.app;

    root /usr/share/nginx/html;

    location = /mydata {
        try_files /index.html =404;
    }
}

# Default (localhost/direct IP) — dashboard only
server {
    listen 80 default_server;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
}
