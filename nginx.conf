# Ngrok domain — serve dashboard
server {
    listen 80;
    server_name *.ngrok-free.dev;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# Default (localhost/direct IP) — dashboard only
server {
    listen 80 default_server;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
}
